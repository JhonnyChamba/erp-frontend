<svg width="220" height="48" viewBox="0 0 220 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="deskountaGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00A3FF"/>
      <stop offset="100%" stop-color="#00F0FF"/>
    </linearGradient>
    <linearGradient id="deskountaGrad2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E40AF"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- ICONO EMBLEMA DESKOUNTA ("D" Dinámica + Crecimiento & Descuento) -->
  <g transform="translate(4, 4)">
    <!-- Base sutil -->
    <rect x="0" y="0" width="40" height="40" rx="12" fill="#0F172A" stroke="#1E293B" stroke-width="1.5"/>
    
    <!-- Letra D estilizada con formas geométricas fluidas -->
    <!-- Columna izquierda del D -->
    <rect x="9" y="9" width="6" height="22" rx="3" fill="url(#deskountaGrad1)"/>
    
    <!-- Arco curvado del D con forma de crecimiento -->
    <path d="M15 9H23C27.9706 9 32 13.0294 32 18C32 20.6 30.89 22.94 29.11 24.58L22 17.5V14.5H15V9Z" fill="url(#deskountaGrad1)"/>
    
    <!-- Flecha/vector diagonal que simboliza balance, cuentas y descuento -->
    <path d="M15 25.5H23C24.8 25.5 26.4 24.8 27.6 23.6L20 31H15V25.5Z" fill="url(#deskountaGrad2)"/>
    
    <!-- Chispa o punto de valor en la esquina -->
    <circle cx="28" cy="12" r="3" fill="#00F0FF" filter="url(#glow)"/>
  </g>

  <!-- TIPOGRAFÍA DE MARCA -->
  <g transform="translate(54, 0)">
    <!-- Texto principal "Desk" en blanco níveo -->
    <text x="0" y="30" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif" font-size="24" font-weight="800" fill="#FFFFFF" letter-spacing="-0.5">
      Desk<tspan fill="url(#accentGrad)">ounta</tspan>
    </text>
    
    <!-- Subtítulo "BUSINESS ERP" alineado -->
    <text x="1" y="42" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif" font-size="8.5" font-weight="700" fill="#94A3B8" letter-spacing="3.2">
      ENTERPRISE ERP
    </text>
  </g>
</svg>
