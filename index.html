<!DOCTYPE html>
<html lang="es" dir="ltr" data-bs-theme="dark" data-color-theme="Blue_Theme" data-layout="vertical">

<head>
  <!-- Required meta tags -->
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Favicon icon-->
  <link rel="shortcut icon" type="image/svg+xml" href="/controller/images/logos/favicon.svg" />

  <!-- Core Css -->
  <link rel="stylesheet" href="/controller/css/styles.css" />

  <title>Deskounta ERP</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <script>
    (function () {
      try {
        var mode = localStorage.getItem('app-theme') || 'dark';
        var color = localStorage.getItem('userTheme') || 'Blue_Theme';
        var layout = localStorage.getItem('app-container-layout') || 'full';
        var card = localStorage.getItem('app-card-style') || 'shadow';
        document.documentElement.setAttribute('data-bs-theme', mode);
        document.documentElement.setAttribute('data-color-theme', color);
        document.documentElement.setAttribute('data-boxed-layout', layout);
        document.documentElement.setAttribute('data-card', card);
      } catch (e) {}
    })();
  </script>
</head>

<body>
  <div id="app"></div>
  <script type="module" src="/src/main.ts"></script>

  <!-- Import Js Files -->
  <script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
  <script src="https://cdn.jsdelivr.net/npm/iconify-icon@1.0.8/dist/iconify-icon.min.js"></script>
</body>

</html>
